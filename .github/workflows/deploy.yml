name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than leaving the
# site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Change these two together.
  #   Custom domain or <user>.github.io  ->  BASE_PATH: "/"
  #   Project site                       ->  BASE_PATH: "/<repo-name>/"
  #                                          SITE_DOMAIN: "https://<user>.github.io"
  SITE_DOMAIN: "https://affordablegolfcartservice.com"
  BASE_PATH: "/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch build-time data snapshot
        # DATA_API_URL / DATA_API_KEY are optional. Leave the repository secrets
        # unset and the snapshot is built from data/ in this repo instead.
        env:
          DATA_API_URL: ${{ secrets.DATA_API_URL }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: npm run fetch-data

      - name: Build static site
        run: npm run build:site

      # configure-pages, upload-pages-artifact and deploy-pages still declare the
      # node20 action runtime and log a deprecation warning. These are already
      # their latest majors — the node24 work is on their main branches but not
      # yet tagged, so the warning clears when GitHub ships those releases.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
